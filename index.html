<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duharuapp</title>
<style>
  :root { --bg: #17435a; --card: #fff8ec; --ink: #1f2633; --muted: #5a6474; --accent: #2ec45e; }
  body { margin: 0; background: var(--bg); font-family: -apple-system, "Apple SD Gothic Neo", "Hiragino Sans", sans-serif; color: var(--ink); }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { color: #fff; font-size: 28px; margin: 0 0 24px; }
  .card { background: var(--card); border-radius: 20px; padding: 24px; }
  h2 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  p { line-height: 1.6; margin: 0 0 12px; }
  a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; padding: 12px 20px; border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>duharuapp</h1>
  <div class="card">
    <h2>블록 쏙쏙 · Block Plop · ブロックぽとん</h2>
    <p class="sub">색깔 정렬 퍼즐 · Color sort puzzle · 色並べパズル</p>
    <p>같은 색 블록을 한 통에 쏙쏙 모으는 퍼즐 게임이에요.<br>Plop same-color blocks into one cup.<br>同じ色のブロックをひとつの筒に集めよう。</p>
    <a class="btn" href="https://apps.apple.com/app/id6825388431">App Store</a>
  </div>
</main>
</body>
</html>
